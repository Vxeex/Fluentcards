<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#0fbd4f"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Round bg -->
  <rect width="64" height="64" rx="16" fill="url(#g2)"/>
  <!-- Wireframe globe -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="white" stroke-width="1.8"/>
  <ellipse cx="32" cy="32" rx="8" ry="18" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <ellipse cx="32" cy="32" rx="18" ry="8" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <ellipse cx="32" cy="32" rx="12" ry="18" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
  <ellipse cx="32" cy="32" rx="18" ry="12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
  <ellipse cx="32" cy="32" rx="4" ry="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="rgba(255,255,255,0.3)" stroke-width="0.7"/>
  <!-- Accent dots on grid intersections -->
  <circle cx="32" cy="14" r="1.5" fill="white"/>
