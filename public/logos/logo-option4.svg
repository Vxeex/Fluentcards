<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#0fbd4f"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Round bg -->
  <rect width="64" height="64" rx="16" fill="url(#g4)"/>
  <!-- Abstract globe: two crossing rings -->
  <ellipse cx="32" cy="32" rx="20" ry="7" fill="none" stroke="white" stroke-width="2" transform="rotate(-20, 32, 32)"/>
  <ellipse cx="32" cy="32" rx="7" ry="20" fill="none" stroke="white" stroke-width="2" transform="rotate(-20, 32, 32)"/>
  <!-- Small accent circles at intersections -->
  <circle cx="32" cy="12" r="2" fill="white" transform="rotate(-20, 32, 32)"/>
  <circle cx="32" cy="52" r="2" fill="white" transform="rotate(-20, 32, 32)"/>
  <!-- Central dot -->
  <circle cx="32" cy="32" r="2.5" fill="white"/>
</svg>